# Change `app` if the name is already taken on Fly.io.
app = "gallstone-risk-dashboard"
primary_region = "fra"

[build]

[env]
  PORT = "8080"
  DB_PATH = "/data/gallstone.db"

# Persistent volume so the SQLite database survives restarts and deploys.
[mounts]
  source = "data"
  destination = "/data"

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = "stop"
  auto_start_machines = true
  min_machines_running = 0

  [http_service.checks]
    [http_service.checks.health]
      grace_period = "10s"
      interval = "30s"
      method = "GET"
      path = "/api/health"
      timeout = "5s"

[[vm]]
  memory = "256mb"
  cpu_kind = "shared"
  cpus = 1
